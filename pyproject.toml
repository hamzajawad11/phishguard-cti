[project]
name = "phishguard-cti"
version = "1.0.0"
description = "FastAPI phishing URL and domain CTI analyzer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.4",
  "jinja2==3.1.5",
  "python-multipart==0.0.20",
  "requests==2.32.3",
  "dnspython==2.7.0",
  "python-dotenv==1.0.1",
  "tldextract==5.1.3",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
# Make the project root importable so tests can `import app.*` when run with
# either `pytest` or `python -m pytest` from the repository root.
pythonpath = ["."]
testpaths = ["tests"]
