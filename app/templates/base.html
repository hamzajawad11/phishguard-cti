<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhishGuard{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNycgZmlsbD0nIzIxMzQ0OScvPjx0ZXh0IHg9JzE2JyB5PScyMicgZm9udC1zaXplPScxNScgZm9udC1mYW1pbHk9J0FyaWFsJyBmb250LXdlaWdodD0nYm9sZCcgdGV4dC1hbmNob3I9J21pZGRsZScgZmlsbD0nIzk0ZDJmZic+UEc8L3RleHQ+PC9zdmc+">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-mark">PG</span>
      <span>
        <strong>PhishGuard</strong>
        <small>CTI URL Intelligence</small>
      </span>
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
      <a href="/analyze" class="{{ 'active' if request.url.path == '/analyze' else '' }}">Analyze</a>
      <a href="/history" class="{{ 'active' if request.url.path == '/history' else '' }}">History</a>
      <a href="/export/csv">Export CSV</a>
    </nav>
    <form action="/sample-data" method="post" class="sample-form">
      <button type="submit">Load Sample Data</button>
    </form>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
