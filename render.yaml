services:
  - type: web
    name: phishguard-cti
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENABLE_URLSCAN_SUBMISSION
        value: "false"
      - key: PHISHGUARD_DATA_DIR
        value: /opt/render/project/src/data
